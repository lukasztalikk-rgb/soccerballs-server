# fly.toml app configuration file generated for soccerballs-relay on 2026-10-22T18:45:25+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'soccerballs-relay'
# Warszawa zostala przez Fly wycofana (region 'waw' nie przyjmuje juz nowych
# maszyn). Z dostepnych europejskich regionow Frankfurt jest najblizej Polski.
primary_region = 'fra'

[build]
[env]
  PORT = '8080'

[http_service]
  internal_port = 8080          # musi sie zgadzac z PORT wyzej
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 800

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
